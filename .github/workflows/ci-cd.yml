name: AquaCraft CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # ========================================================
  continuous-integration:
    name: "Stage 1: CI (Lint, Test, Build)"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 3. Install Monorepo Dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: 4. Run Syntax Linting
        run: npm run lint

      - name: 5. Run Backend Unit Tests
        run: npm test

      - name: 6. Test Frontend Production Build
        run: npm run build:frontend

  # ========================================================
  # STAGE 2: CONTAINERIZATION (DOCKER BUILD & PUSH)
  # ========================================================
  containerization:
    name: "Stage 2: Docker Build & Push"
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aquacraft-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/aquacraft-backend:${{ github.sha }}

      - name: 5. Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aquacraft-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/aquacraft-frontend:${{ github.sha }}

  # ========================================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (AWS EC2)
  # ========================================================
  continuous-deployment:
    name: "Stage 3: CD (Deploy to AWS EC2)"
    needs: containerization
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Copy docker-compose to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/aquacraft"

      - name: 3. Deploy & Run Containers on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,JWT_SECRET
          script: |
            mkdir -p ~/aquacraft
            cd ~/aquacraft

            if [ -z "$MONGO_ROOT_USER" ] || [ -z "$MONGO_ROOT_PASSWORD" ]; then
              echo "Missing MONGO_ROOT_USER or MONGO_ROOT_PASSWORD in GitHub Secrets"
              exit 1
            fi

            # Generate .env safely for docker-compose (URL-encode credentials for MONGO_URI)
            python3 - <<'EOF'
            import os, sys, urllib.parse

            user = os.environ["MONGO_ROOT_USER"]
            pwd = os.environ["MONGO_ROOT_PASSWORD"]
            if "'" in user or "'" in pwd or "\n" in user or "\n" in pwd:
                print("MONGO_ROOT_USER / MONGO_ROOT_PASSWORD cannot contain single quotes or newlines", file=sys.stderr)
                sys.exit(1)

            mongo_uri = (
                f"mongodb://{urllib.parse.quote(user, safe='')}"
                f":{urllib.parse.quote(pwd, safe='')}"
                f"@mongodb:27017/aquacraft?authSource=admin"
            )
            lines = [
                f"DOCKER_USERNAME={os.environ.get('DOCKER_USERNAME', '')}",
                f"MONGO_ROOT_USER='{user}'",
                f"MONGO_ROOT_PASSWORD='{pwd}'",
                f"MONGO_URI='{mongo_uri}'",
            ]
            jwt = os.environ.get("JWT_SECRET", "")
            if jwt:
                lines.append(f"JWT_SECRET={jwt}")
            with open(".env", "w") as f:
                f.write("\n".join(lines) + "\n")
            EOF

            # Pull latest images and recreate containers
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old unused images
            docker image prune -f

            # Health Check
            sleep 8
            curl -f http://localhost:5000/api/health || exit 1

